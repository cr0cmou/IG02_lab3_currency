<html>
    <head>
        <title>Currency Converter</title>
        <link rel="stylesheet" href="./style.css">
    </head>

    <body>
        <h1 class="titles" id="currency_converter">Currency Converter</h1>
        <label id="amount_label">amount to convert:
            <input
            type="number"
            id="amount_input"
            name="amount_input"
            >
            
        </label>

        <label id="exchange_label">exchange rate:
            <input
                type="number"
                id="rate_input"
                name="rate_input"
            >

        </label>

        <button>compute!</button>

        <label id="result_label">result:
            <textarea id="result_text">
            </textarea>
        </label>

    </body>
</html>
